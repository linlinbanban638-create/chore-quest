<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Chore Quest</title>
<style>
:root{--bg:#fff8e7;--ink:#1d2340;--card:#ffffff;--c1:#2f6fe4;--c2:#2e9e3f;--c3:#7a3fd1;--c4:#e0561f;--gold:#ffc928;--soft:#e9eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a33;--ink:#f4f1e6;--card:#1f2748;--soft:#2a3562}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{padding:10px 16px 6px;text-align:center}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:26px;letter-spacing:.5px;margin:0;color:var(--ink);text-shadow:2px 2px 0 var(--gold)}
.bar{display:flex;gap:3px;margin:8px 0 0}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.bar i.on{background:var(--ch)}
main{flex:1;display:flex;flex-direction:column;padding:6px 14px 10px;min-height:0}
.chap{align-self:flex-start;background:var(--ch);color:#fff;font-weight:700;padding:6px 14px;border-radius:14px 14px 14px 4px;font-size:15px}
.stage{flex:1;margin:10px 0;border:3px solid var(--ch);border-radius:20px;background:var(--card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow-y:auto;position:relative}
.scene{font-size:54px;text-align:center;line-height:1.1;min-height:64px}
.cube{display:inline-block;width:56px;height:56px;border-radius:12px;background:#4cd137;border:3px solid #2b9a1f;position:relative;vertical-align:middle;margin:0 4px}
.cube:before,.cube:after{content:"";position:absolute;top:16px;width:9px;height:12px;background:#fff;border:2px solid #123;border-radius:50%}
.cube:before{left:11px}.cube:after{right:11px}
.cube b{position:absolute;left:17px;bottom:9px;width:18px;height:8px;border-bottom:3px solid #123;border-radius:0 0 12px 12px}
.say{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:flex-start;gap:8px;animation:pop .25s ease-out}
.line.hero{flex-direction:row-reverse}
.who{font-size:26px;flex:none}
.bub{background:var(--soft);border:2px solid var(--ink);border-radius:18px;padding:9px 13px;font-size:18px;line-height:1.3;font-weight:600}
.hero .bub{border-radius:18px 18px 4px 18px}.buddy .bub{border-radius:18px 18px 18px 4px}
.sign{align-self:center;background:#14346b;color:#fff;border:2px solid #7fd6ff;border-radius:12px;padding:8px 14px;font-weight:700;text-align:center}
.note{background:var(--gold);color:#3a2a00;border-radius:14px;padding:9px 12px;font-weight:700;font-size:15px;text-align:center}
.w{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:10px;background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:17px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;width:100%}
.chk span{width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;flex:none;font-size:16px}
.chk.d span{background:var(--c2);color:#fff;border-color:var(--c2)}
.chk.d{text-decoration:line-through;opacity:.75}
.btn{background:var(--ch);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.timer{text-align:center;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.big{font-family:Impact,"Arial Black",sans-serif;font-size:40px;text-align:center;color:#fff;background:#c2262e;border-radius:10px;padding:8px;transform:rotate(-2deg);animation:pop .4s}
nav{display:flex;gap:10px;padding:0 14px 12px}
nav .btn{flex:1}
nav .btn:disabled{opacity:.35}
.hint{text-align:center;font-size:13px;opacity:.7;margin-top:-4px}
.learn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.learn div{background:var(--soft);border-radius:12px;padding:10px;font-weight:700;font-size:15px;text-align:center}
.learn div em{display:block;font-size:26px;font-style:normal}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:17px;font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><h1>THE CHORE QUEST</h1><div class="bar" id="bar"></div></header>
<main>
  <div class="chap" id="chap"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
</main>
<nav><button class="btn alt" id="back">Back</button><button class="btn" id="next">Next</button></nav>
<script>
var HERO="🧒", BUDDY="<span class='cube'><b></b></span>";
var CH=[
 {n:"Chapter 1: The Notification Trap",c:"var(--c1)"},
 {n:"Chapter 2: Build Your Quest",c:"var(--c2)"},
 {n:"Chapter 3: The Distraction Boss",c:"var(--c3)"},
 {n:"Chapter 4: Level Complete",c:"var(--c4)"}];
var P=[
 {ch:0,s:"🛋️📱🧺",l:[["h","Awesome! I have loads of time!"]],sign:"🎮 Game night starts in one hour!"},
 {ch:0,s:"🧒💬🟩",l:[["b","What about your chores?"],["h","I’ll do them after one game."]],sign:"CHORES: Laundry · Dishes · Trash"},
 {ch:0,s:"⏰🎮",l:[["h","Just one more round..."],["b","Your chores are still waiting!"]],sign:"20 min have passed"},
 {ch:0,s:"😰",l:[["h","Now I’m worried I won’t finish."],["b","Let’s make a plan—not a panic!"]],note:"Notice when “one more minute” gets in the way of your plan."},
 {ch:1,s:"📋✨",l:[["b","Three jobs. That feels clearer!"]],w:"list"},
 {ch:1,s:"👕👕👕",l:[["b","Start with the shirts."],["h","I can do one small step!"]]},
 {ch:1,s:"⏳",l:[["b","Ten minutes of trying!"],["b","Then check your progress."]],w:"timer"},
 {ch:1,s:"📱🅿️",l:[["h","Now, back to our quest!"]],sign:"TABLET PARKING",note:"Make a checklist, choose a small first step, and put distractions aside."},
 {ch:2,s:"👾📱",l:[["h","Ooh... I really want to!"]],sign:"Join us now?",w:"choice"},
 {ch:2,s:"🧺🧒",l:[["b","What do you want finished first?"],["h","My chores—then I can relax!"]]},
 {ch:2,s:"💻✅",l:[["h","Finishing chores. See you at seven!"]],sign:"See you then ✓"},
 {ch:2,s:"🧺🍽️🗑️",l:[["h","One job at a time!"]],note:"You can be friendly and still say, “Not right now.”"},
 {ch:3,s:"👍🧺",l:[["b","Ready for the final check?"],["h","Laundry away. Dishes done. Trash out!"]]},
 {ch:3,s:"🎉🏆🎉",big:"QUEST COMPLETE!",l:[["h","I kept my promise!"]]},
 {ch:3,s:"📱😊",l:[["h","And my chores are finished!"]],sign:"You made it! 🌟"},
 {ch:3,s:"🌟",l:[["b","What helped you finish?"],["h","Small steps—and sticking to my plan!"]],note:"Celebrate your effort, not just the finished job."}
];
var LEARN=[["📋","Make a clear plan."],["👣","Start with one small step."],["⏱️","Give yourself time to focus."],["💬","Tell others when you’ll be ready."],["⭐","Be proud of your effort."]];
var i=0,timerId=null,stage=document.getElementById("stage");
var bar=document.getElementById("bar");
P.forEach(function(){bar.appendChild(document.createElement("i"))});
bar.appendChild(document.createElement("i"));

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  clearInterval(timerId);
  var last=i>=P.length, p=P[Math.min(i,P.length-1)], col=CH[p.ch].c;
  document.documentElement.style.setProperty("--ch",last?"var(--gold)":col);
  [].forEach.call(bar.children,function(b,k){b.className=k<=i?"on":""});
  document.getElementById("chap").textContent=last?"What We Learned":CH[p.ch].n+"  ("+(i+1)+"/"+P.length+")";
  stage.innerHTML="";
  document.getElementById("back").disabled=i===0;
  document.getElementById("next").textContent=last?"Play again":(i===P.length-1?"Finish":"Next");
  document.getElementById("hint").textContent=last?"":"Tap Next, swipe, or use arrow keys";
  if(last){renderEnd();return}
  stage.appendChild(el("div","scene",p.s.indexOf("🟩")>-1?p.s.replace("🟩",BUDDY):p.s));
  if(p.big)stage.appendChild(el("div","big",p.big));
  var say=el("div","say");
  p.l.forEach(function(x){
    var h=x[0]==="h";
    var line=el("div","line "+(h?"hero":"buddy"));
    line.appendChild(el("div","who",h?HERO:BUDDY));
    line.appendChild(el("div","bub",esc(x[1])));
    say.appendChild(line);
  });
  stage.appendChild(say);
  if(p.sign)stage.appendChild(el("div","sign",esc(p.sign)));
  if(p.w==="list")widgetList();
  if(p.w==="timer")widgetTimer();
  if(p.w==="choice")widgetChoice();
  if(p.note)stage.appendChild(el("div","note",esc(p.note)));
}
function widgetList(){
  var w=el("div","w");
  ["Fold laundry","Wash dishes","Take out trash"].forEach(function(t){
    var b=el("button","chk","<span></span>"+t);
    b.onclick=function(){b.classList.toggle("d");b.firstChild.textContent=b.classList.contains("d")?"✓":""};
    w.appendChild(b);
  });
  stage.appendChild(w);
}
function widgetTimer(){
  var w=el("div","w"),t=el("div","timer","10:00"),b=el("button","btn","Try a 10-second demo"),s=0;
  b.onclick=function(){
    clearInterval(timerId);s=10;t.textContent="0:10";
    timerId=setInterval(function(){s--;t.textContent="0:"+(s<10?"0":"")+s;
      if(s<=0){clearInterval(timerId);t.textContent="Check your progress! ✅"}},1000);
  };
  w.appendChild(t);w.appendChild(b);stage.appendChild(w);
}
function widgetChoice(){
  var w=el("div","w"),r=el("div","row"),out=el("div","note","What would you do?");
  var a=el("button","btn alt","Join now"),b=el("button","btn","Not right now");
  a.onclick=function(){out.textContent="Tempting! But the chores would still be waiting. Try again?"};
  b.onclick=function(){out.textContent="Friendly and firm. Plan protected! 💪"};
  r.appendChild(a);r.appendChild(b);w.appendChild(r);w.appendChild(out);stage.appendChild(w);
}
function renderEnd(){
  var g=el("div","learn");
  LEARN.forEach(function(x){g.appendChild(el("div","","<em>"+x[0]+"</em>"+x[1]))});
  stage.appendChild(g);
  stage.appendChild(el("div","note","What small task will you turn into a quest today?"));
  var inp=el("input");inp.placeholder="Type your quest…";inp.maxLength=80;
  var go=el("button","btn","Start my quest"),res=el("div","note");res.style.display="none";
  go.onclick=function(){
    var v=inp.value.trim();if(!v)return;
    res.style.display="block";
    res.innerHTML="Quest accepted: <u>"+esc(v)+"</u><br>Pick one small first step. Ten focused minutes. Go! 🏆";
  };
  stage.appendChild(inp);stage.appendChild(go);stage.appendChild(res);
}
function next(){i=i>=P.length?0:i+1;render()}
function back(){if(i>0){i--;render()}}
document.getElementById("next").onclick=next;
document.getElementById("back").onclick=back;
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")back();
});
var x0=null;
stage.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",function(e){
  if(x0===null||e.target.tagName==="INPUT")return;
  var d=e.changedTouches[0].clientX-x0;x0=null;
  if(d<-60)next();else if(d>60)back();
},{passive:true});
render();
</script>
</body>
</html>
